[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-algebra-machine-learning"
version = "1.0.0"
description = "Matrix methods for neural networks, word embeddings, and movie recommendations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbclient>=0.10,<1"]
report = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
